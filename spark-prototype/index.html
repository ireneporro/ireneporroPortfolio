<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>Spark</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --coral:#ff5a4e; --coral-d:#e8443a; --pink:#ff3d7f; --peach:#ffb26b; --sun:#ffd166; --mint:#3ccfa0; --sky:#4f8cff; --grape:#8b5cf6;
  --grad:linear-gradient(120deg,#ff9a3c 0%,#ff5a4e 45%,#ff3d7f 100%);
  --ink:#1d1625; --body:#4f4658; --muted:#8a8193; --line:#efe6ea; --line2:#f6eff2; --bg:#fff7f5; --soft:#ffecec;
}
* { box-sizing:border-box; } html,body { margin:0; }
body { position:relative; width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--ink); font:14px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; cursor:pointer; }
input, textarea { font:inherit; color:var(--ink); }
:focus-visible { outline:3px solid var(--grape); outline-offset:2px; }
[hidden] { display:none !important; }
.app { display:grid; grid-template-columns:232px 1fr; width:1440px; height:900px; }
svg.ico { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.side { position:relative; display:flex; flex-direction:column; padding:24px 16px; background:#fff; border-right:1px solid var(--line); }
.logo { display:flex; align-items:center; gap:9px; padding:0 8px 22px; font-size:22px; font-weight:800; letter-spacing:-.04em; }
.logo i { position:relative; width:30px; height:30px; border-radius:10px; background:var(--grad); }
.logo i::after { content:"✦"; position:absolute; inset:0; display:grid; place-items:center; color:#fff; font-size:15px; font-style:normal; }
.viewas { display:block; width:calc(100% - 8px); margin:0 4px 18px; padding:8px 10px 10px; border:1.5px solid var(--line); border-radius:14px; background:var(--bg); text-align:left; }
.viewas:hover { border-color:#ffc2bd; }
.viewas > small { display:block; margin-bottom:6px; color:var(--muted); font-size:10.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
.viewas .row { display:flex; align-items:center; gap:10px; }
.viewas b { display:block; font-size:13px; line-height:1.3; white-space:nowrap; } .viewas .row small { display:block; overflow:hidden; color:var(--muted); font-size:11.5px; line-height:1.35; white-space:nowrap; text-overflow:ellipsis; }
.viewas .chev { width:15px; margin-left:auto; color:var(--muted); }
.rolemenu { position:absolute; z-index:40; left:12px; top:146px; width:300px; padding:6px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 22px 50px rgba(80,20,40,.18); }
.rolemenu button { display:flex; align-items:center; gap:10px; width:100%; padding:9px 10px; border:0; border-radius:11px; background:none; text-align:left; }
.rolemenu button:hover, .rolemenu button[aria-checked="true"] { background:var(--soft); }
.rolemenu b { display:block; font-size:13px; } .rolemenu small { display:block; color:var(--muted); font-size:11.5px; }
.rolemenu hr { margin:5px 6px; border:0; border-top:1px solid var(--line); }
.rolemenu .av { width:32px; height:32px; font-size:11px; }
.av { display:grid; place-items:center; flex:none; width:36px; height:36px; border-radius:50%; color:#fff; font-size:12px; font-weight:800; background:var(--grad); }
.av.a { background:linear-gradient(135deg,#4f8cff,#8b5cf6); } .av.b { background:linear-gradient(135deg,#3ccfa0,#4f8cff); } .av.c { background:linear-gradient(135deg,#ffd166,#ff9a3c); } .av.d { background:linear-gradient(135deg,#ff3d7f,#8b5cf6); } .av.e { background:linear-gradient(135deg,#3ccfa0,#ffd166); } .av.n { background:#efe6ea; color:var(--body); }
.av.xs { width:30px; height:30px; font-size:10px; }
.nav .nl { display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; margin-bottom:2px; border:0; border-radius:12px; background:none; color:var(--body); font-weight:600; text-align:left; }
.nav .nl:hover { background:var(--line2); }
.nav .nl[aria-current="page"] { background:var(--soft); color:var(--coral-d); }
.nav .nl em { margin-left:auto; padding:1px 7px; border-radius:20px; background:var(--coral); color:#fff; font-size:10.5px; font-style:normal; font-weight:800; }
.nav .nl em.n { background:var(--line); color:var(--body); }
.nav .nl .lk { margin-left:auto; width:14px; color:var(--muted); }
.demo { margin:auto 4px 0; padding:14px; border-radius:16px; background:var(--grad); color:#fff; font-size:12.5px; }
.demo b { display:block; font-size:14px; margin-bottom:4px; }
.demo .btn { margin-top:10px; background:rgba(255,255,255,.95); color:var(--coral-d); border:0; }
.demo.calm { background:#f4fbf8; color:#1e6b52; border:1px solid #d3f0e4; } .demo.calm b { color:#178a63; }
.main { position:relative; display:flex; flex-direction:column; min-width:0; min-height:0; height:900px; }
.top { display:flex; align-items:center; gap:12px; flex:none; height:68px; padding:0 34px; background:#fff; border-bottom:1px solid var(--line); }
.search { display:flex; align-items:center; gap:10px; flex:1; max-width:560px; height:42px; padding:0 14px; border:1.5px solid var(--line); border-radius:14px; color:var(--muted); font-size:13.5px; }
.search:focus-within { border-color:#ffb4ad; box-shadow:0 0 0 4px #fff0ee; }
.search input { flex:1; min-width:0; height:100%; border:0; outline:0; background:none; font-size:13.5px; }
.sp { flex:1; }
.chipbar { display:inline-flex; align-items:center; gap:8px; height:30px; padding:0 12px; border:0; border-radius:20px; background:#fff3e6; color:#c25e10; font-size:12px; font-weight:700; }
.chipbar.red { background:#ffe9e7; color:#c4302b; } .chipbar.green { background:#e6f8f1; color:#178a63; }
.content { flex:1; min-height:0; padding:26px 34px 72px; overflow:auto; }
.head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:18px; }
.kick { margin:0 0 4px; color:var(--coral); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
h1 { margin:0; font-size:30px; font-weight:800; letter-spacing:-.035em; line-height:1.15; }
.sub { margin:4px 0 0; color:var(--body); font-size:14px; }
.btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font:700 13px "Plus Jakarta Sans", system-ui, sans-serif; white-space:nowrap; }
.btn:hover:not(:disabled) { border-color:#ffc2bd; }
.btn.pri { border:0; background:var(--grad); color:#fff; box-shadow:0 8px 20px rgba(255,90,78,.28); }
.btn.out { border-color:var(--coral); color:var(--coral-d); }
.btn.out[aria-pressed="true"] { background:var(--soft); }
.btn.sm { height:32px; padding:0 12px; font-size:12px; border-radius:10px; }
.btn.ghost { border-color:transparent; background:none; color:var(--body); }
.btn:disabled { opacity:.42; cursor:not-allowed; box-shadow:none; }
.btns { display:flex; gap:10px; align-items:center; }
.card { background:#fff; border:1px solid var(--line); border-radius:20px; }
.tag { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; background:var(--soft); color:var(--coral-d); font-size:11.5px; font-weight:700; white-space:nowrap; }
.tag.b { background:#eaf1ff; color:#2f5fd0; } .tag.g { background:#e6f8f1; color:#178a63; } .tag.y { background:#fff3d6; color:#a56b00; } .tag.p { background:#f1ebff; color:#6a3fd6; } .tag.n { background:var(--line2); color:var(--body); } .tag.k { background:var(--ink); color:#fff; }
.tags { display:flex; gap:6px; flex-wrap:wrap; }
.chips { display:flex; gap:8px; margin:0 0 18px; flex-wrap:wrap; }
.chips button { padding:7px 14px; border:1.5px solid var(--line); border-radius:20px; background:#fff; font-size:12.5px; font-weight:700; color:var(--body); }
.chips button:hover { border-color:#ffc2bd; }
.chips button[aria-pressed="true"] { border-color:transparent; background:var(--grad); color:#fff; }
.chips .div { width:1px; margin:4px 4px; background:var(--line); }
.ver { display:inline-flex; align-items:center; gap:4px; color:#178a63; font-size:11px; font-weight:700; }
.ver svg { width:14px; height:14px; }
.note { display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-radius:14px; background:#f4f1ff; color:#4b2fa3; font-size:12.5px; }
.note svg { width:16px; margin-top:1px; }
.note.mint { background:#ecfaf4; color:#1e6b52; } .note.warn { background:#fff3e6; color:#9a4b0a; } .note.red { background:#ffeceb; color:#b42d27; }
.empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; padding:44px 24px; text-align:center; color:var(--body); }
.empty .ic { display:grid; place-items:center; width:54px; height:54px; margin-bottom:6px; border-radius:18px; background:var(--soft); color:var(--coral-d); font-size:24px; }
.empty b { color:var(--ink); font-size:16px; } .empty p { margin:0 0 8px; max-width:380px; font-size:13px; }
/* Teacher */
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; }
.stat { position:relative; overflow:hidden; padding:18px 22px; border-radius:20px; color:#fff; }
.stat.s1 { background:linear-gradient(120deg,#ff9a3c,#ff5a4e); } .stat.s2 { background:linear-gradient(120deg,#ff5a4e,#ff3d7f); } .stat.s3 { background:linear-gradient(120deg,#ff3d7f,#8b5cf6); }
.stat small { font-size:13px; font-weight:700; opacity:.9; }
.stat b { display:block; margin-top:4px; font-size:34px; font-weight:800; letter-spacing:-.04em; }
.stat span { font-size:12px; opacity:.88; }
.stat::after { content:""; position:absolute; right:-30px; top:-30px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.14); }
.stat.bump b { animation:bump .6s; }
@keyframes bump { 40% { transform:scale(1.08); } }
.g3 { display:grid; grid-template-columns:1fr 1fr 1.15fr; gap:16px; }
.card-h { display:flex; justify-content:space-between; align-items:center; padding:16px 20px 6px; }
.card-h h3 { margin:0; font-size:15.5px; font-weight:800; }
.card-h small { color:var(--muted); font-size:12px; font-weight:700; }
.kw { display:grid; grid-template-columns:96px 1fr 28px; align-items:center; gap:10px; padding:7px 20px; font-size:12.5px; }
.kw i { height:9px; border-radius:9px; }
.ind { display:grid; grid-template-columns:30px 1fr 40px; align-items:center; gap:10px; padding:7px 20px; font-size:12.5px; }
.ind .ic { display:grid; place-items:center; width:30px; height:30px; border-radius:9px; font-size:15px; }
.ind .bar { height:7px; margin-top:4px; border-radius:7px; background:var(--line2); overflow:hidden; } .ind .bar i { display:block; height:100%; border-radius:7px; }
.qlist { max-height:300px; overflow:auto; padding-bottom:8px; }
.q { display:flex; gap:10px; padding:10px 20px; border-top:1px solid var(--line2); }
.q:first-child { border-top:0; }
.q p { margin:0; font-size:12.5px; } .q small { color:var(--muted); font-size:11px; }
.q.fresh { background:#fff8ef; }
.demo-bar { display:flex; align-items:center; gap:12px; flex:none; padding:10px 34px; background:var(--ink); color:#fff; font-size:13px; }
.demo-bar b { color:var(--sun); }
.demo-bar .tabs { margin-left:auto; }
.tabs { display:inline-flex; gap:4px; padding:4px; border-radius:12px; background:var(--line2); }
.tabs button { height:30px; padding:0 12px; border:0; border-radius:9px; background:none; color:var(--body); font-size:12.5px; font-weight:700; }
.tabs button[aria-selected="true"] { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.tabs button em { margin-left:4px; color:var(--muted); font-style:normal; }
.demo-bar .tabs { background:rgba(255,255,255,.1); } .demo-bar .tabs button { color:#e9e2ef; } .demo-bar .tabs button[aria-selected="true"] { color:var(--ink); }
table.roster { width:100%; border-collapse:collapse; font-size:13px; }
.roster th { padding:10px 20px; border-bottom:1px solid var(--line); color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.06em; text-align:left; text-transform:uppercase; }
.roster td { padding:10px 20px; border-bottom:1px solid var(--line2); }
.roster tr:last-child td { border-bottom:0; }
.roster .who { display:flex; align-items:center; gap:10px; font-weight:700; }
.codecard { display:flex; align-items:center; gap:18px; padding:20px 22px; }
.codebig { padding:10px 16px; border:2px dashed #ffc2bd; border-radius:14px; background:var(--bg); font-size:24px; font-weight:800; letter-spacing:.12em; }
.lockp { max-width:820px; margin:30px auto 0; padding:34px; text-align:center; }
.lockp .ic { display:inline-grid; place-items:center; width:62px; height:62px; margin-bottom:12px; border-radius:20px; background:var(--ink); color:#fff; }
.lockp .ic svg { width:26px; height:26px; }
.lockp h2 { margin:0 0 6px; font-size:24px; letter-spacing:-.03em; }
.lockp > p { margin:0 auto 22px; max-width:520px; color:var(--body); }
.next { display:grid; grid-template-columns:1fr 1fr; gap:14px; text-align:left; }
.next .card { padding:18px; }
.next b { display:block; font-size:15px; } .next p { margin:4px 0 14px; color:var(--body); font-size:12.5px; }
/* Explore */
.mentors { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.m { overflow:hidden; display:flex; flex-direction:column; }
.m .cover { position:relative; flex:none; height:82px; }
.m .cover .av { position:absolute; left:20px; bottom:-26px; width:60px; height:60px; font-size:18px; border:4px solid #fff; }
.m .body { display:flex; flex-direction:column; flex:1; padding:32px 20px 18px; }
.m .mh { display:flex; align-items:center; gap:8px; }
.m h3 { margin:0; font-size:16px; font-weight:800; }
.m .mrole { color:var(--body); font-size:12.5px; }
.m p { margin:10px 0 12px; color:var(--body); font-size:12.5px; }
.m .act { display:flex; gap:8px; margin-top:auto; padding-top:14px; }
.m .act .btn { flex:1; justify-content:center; }
.m .paused { margin-top:10px; color:var(--muted); font-size:11.5px; font-weight:600; }
.badge-day { position:absolute; right:14px; top:14px; padding:4px 10px; border-radius:20px; background:rgba(255,255,255,.92); color:var(--coral-d); font-size:11px; font-weight:800; }
.ib { display:grid; place-items:center; flex:none; width:32px; height:32px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--body); }
.ib[aria-pressed="true"] { border-color:var(--coral); background:var(--soft); color:var(--coral-d); }
.ib[aria-pressed="true"] svg { fill:currentColor; }
.ib:disabled { opacity:.42; cursor:not-allowed; }
/* Messages */
.msgs { display:grid; grid-template-columns:310px 1fr 280px; height:900px; }
.thread-list { overflow:auto; border-right:1px solid var(--line); background:#fff; }
.th { display:flex; gap:12px; width:100%; padding:14px 18px; border:0; border-bottom:1px solid var(--line2); background:#fff; text-align:left; }
.th:hover { background:var(--bg); }
.th[aria-selected="true"] { background:var(--soft); }
.th > div { min-width:0; flex:1; }
.th b { display:flex; align-items:center; gap:6px; font-size:13.5px; } .th small { display:block; overflow:hidden; color:var(--muted); font-size:12px; white-space:nowrap; text-overflow:ellipsis; }
.th .t { color:var(--muted); font-size:11px; white-space:nowrap; }
.th .dot { width:8px; height:8px; border-radius:50%; background:var(--coral); }
.chat { display:flex; flex-direction:column; min-height:0; background:var(--bg); }
.chat-h { display:flex; align-items:center; gap:10px; flex:none; height:64px; padding:0 26px; border-bottom:1px solid var(--line); background:#fff; }
.chat-h b { font-size:15px; }
.scroll { display:flex; flex-direction:column; flex:1; min-height:0; overflow:auto; padding:18px 26px 6px; }
.bub { max-width:72%; margin-bottom:10px; padding:11px 15px; border-radius:18px; font-size:13.5px; }
.bub.in { align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:6px; }
.bub.out { align-self:flex-end; background:var(--grad); color:#fff; border-bottom-right-radius:6px; }
.bub.pop { animation:pop .3s ease-out; }
@keyframes pop { from { opacity:0; transform:translateY(8px); } }
.day { align-self:center; margin:4px 0 12px; color:var(--muted); font-size:11.5px; }
.status { align-self:flex-end; margin:-4px 0 10px; color:var(--muted); font-size:11.5px; }
.chat-f { flex:none; padding:8px 26px 14px; }
.composer { display:flex; align-items:center; gap:10px; padding:6px 6px 6px 16px; border:1.5px solid var(--line); border-radius:16px; background:#fff; }
.composer:focus-within { border-color:#ffb4ad; box-shadow:0 0 0 4px #fff0ee; }
.composer.bad { border-color:#f2a19b; }
.composer input { flex:1; height:36px; border:0; outline:0; background:none; font-size:13.5px; }
.send { display:grid; place-items:center; width:38px; height:38px; border:0; border-radius:12px; background:var(--grad); color:#fff; }
.send:disabled { opacity:.35; cursor:not-allowed; }
.prompt { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.prompt button { padding:6px 12px; border:1.5px dashed #ffc2bd; border-radius:14px; background:#fff; color:var(--coral-d); font-size:12px; font-weight:700; }
.prompt button:hover { border-style:solid; }
.guard { margin-top:8px; }
.fine { display:flex; align-items:center; gap:6px; margin:8px 2px 0; color:var(--muted); font-size:11.5px; }
.fine svg { width:13px; height:13px; }
.profile { overflow:auto; padding:24px 20px; background:#fff; border-left:1px solid var(--line); }
.profile .av.lg { width:72px; height:72px; font-size:22px; margin-bottom:12px; }
.profile h3 { margin:0; font-size:17px; }
.kv { margin-top:14px; font-size:12.5px; }
.kv div { padding:9px 0; border-bottom:1px solid var(--line2); }
.kv small { display:block; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
/* Opportunities */
.opps { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.op { display:flex; flex-direction:column; padding:18px 20px; }
.op-h { display:flex; align-items:center; gap:14px; }
.op-h .lg { display:grid; place-items:center; flex:none; width:50px; height:50px; border-radius:16px; color:#fff; font-size:22px; }
.op h3 { margin:0; font-size:16px; font-weight:800; }
.op .org { display:flex; align-items:center; gap:4px; color:var(--body); font-size:12.5px; }
.op .org svg { width:13px; height:13px; }
.op-h .ib { margin-left:auto; width:36px; height:36px; border-radius:11px; }
.op p { margin:10px 0 12px; color:var(--body); font-size:13px; }
.facts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.facts div { padding:8px 10px; border-radius:12px; background:var(--bg); font-size:12px; font-weight:700; line-height:1.35; }
.facts small { display:block; margin-bottom:2px; color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
.op-f { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; padding-top:12px; border-top:1px solid var(--line2); }
.op-f-wrap { margin-top:12px; }
.new { padding:3px 9px; border-radius:8px; background:var(--ink); color:#fff; font-size:10.5px; font-weight:800; letter-spacing:.06em; }
.pill { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:11.5px; font-weight:800; }
.pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.pill.applied { background:#eaf1ff; color:#2f5fd0; } .pill.accepted { background:#e6f8f1; color:#178a63; } .pill.declined { background:var(--line2); color:var(--body); } .pill.pending { background:#fff3d6; color:#a56b00; }
.skel { padding:18px 20px; height:250px; }
.skel i { display:block; height:12px; margin-bottom:12px; border-radius:8px; background:linear-gradient(90deg,#f6eff2,#fdf8f9,#f6eff2); background-size:200% 100%; animation:sh 1s infinite linear; }
@keyframes sh { to { background-position:-200% 0; } }
/* Trials */
.trials { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
.tr { position:relative; display:flex; flex-direction:column; padding:22px; }
.tr .n { display:grid; place-items:center; width:40px; height:40px; margin-bottom:14px; border-radius:13px; background:var(--soft); color:var(--coral-d); font-size:15px; font-weight:800; }
.tr.done .n { background:var(--mint); color:#fff; } .tr.now { border:2px solid var(--coral); box-shadow:0 14px 34px rgba(255,90,78,.15); } .tr.now .n { background:var(--grad); color:#fff; } .tr.lock .n { background:var(--ink); color:#fff; } .tr.ready .n { background:#e6f8f1; color:#178a63; }

  <p>“${esc(m.quote)}”</p><div class="tags"><span class="tag ${ic2}">${il}</span>${m.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
  ${m.open ? '' : '<div class="paused">⏸ Not taking new questions this week</div>'}

function filteredMentors(demo) {
  const q = demo ? '' : S.q.trim().toLowerCase(), ind = demo ? S.dind : S.ind;
  let list = MENTORS.filter(m => {
    if (q) return [m.name, m.role, m.org, IND[m.ind][1], m.quote, ...m.tags].join(' ').toLowerCase().includes(q);
    if (ind === 'foryou') return S.interests.includes(m.ind) || MENTORS[S.motd] === m;
    return ind === 'all' || m.ind === ind;

  if (list.includes(md)) list = [md, ...list.filter(m => m !== md)];

}
function gridHTML(demo) {

function exploreHTML(demo) {

function composer(ph) {
  return `<div class="composer" id="compBox"><input id="comp" placeholder="${ph}" aria-label="Message" autocomplete="off" maxlength="400"><button class="send" data-act="send" aria-label="Send" disabled>${ic('send')}</button></div>
  <div class="note red guard" id="guard" hidden>${ic('shield')}<span><b>Keep contact details on Spark.</b> Phone numbers, emails and social handles can’t be shared in messages.</span></div>`;
}
function checkComposer() {
  const i = $('#comp'); if (!i) return;
  const bad = CONTACT.test(i.value), empty = !i.value.trim();
  $('#guard').hidden = !bad; $('#compBox').classList.toggle('bad', bad);
  $('[data-act="send"]').disabled = bad || empty;
}
function openThread(id) {
  if (!S.threads[id]) { S.threads[id] = { when:'Now', msgs:[] }; S.order.unshift(id); }
  S.cur = id; S.threads[id].unread = false; S.view.student = 'msg';
}
function studentSend() {
  const i = $('#comp'), t = i.value.trim(); if (!t || CONTACT.test(t)) return;
  const th = S.threads[S.cur], m = mentor(S.cur), first = !th.msgs.some(x => x.f === 's');
  th.msgs.forEach(x => x.fresh = false);
  th.msgs.push({ f:'s', t, fresh:true }); th.when = 'Now';
  S.order = [S.cur, ...S.order.filter(x => x !== S.cur)];
  S.sent[S.cur] = `Sent · ${m.name.split(' ')[0]} ${m.reply.replace('Usually', 'usually replies')}`;
  S.newQs.unshift({ who:'Maya', av:'', text:t, to:m.role });
  if (first) S.conv++;
  render(); $('#comp')?.focus();
  toast(`Question sent to ${m.name.split(' ')[0]}`);
}

function runHint(k) {

  e.preventDefault(); const c = (e.clipboardData.getData('text') || '').replace(/[^a-z0-9]/gi, '').toUpperCase().slice(0, 6).split(''); S.onb.chars = [0,1,2,3,4,5].map(i => c[i] || ''); S.onb.bad = false; renderOnb(); $('#onb [data-act="onbCode"]')?.focus();
});

const start = new URLSearchParams(location.search);
if (ROLES[start.get('role')]) S.role = start.get('role');
render(); renderHint();
if (start.get('s') === 'onboard') startOnb();
</script>
