<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440" />
<title>Certa Admin</title>
<meta name="robots" content="noindex" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --g800:#2f5523; --g700:#3f6e2e; --g600:#558241; --g500:#6d9957; --g300:#b7cfa9; --g100:#eaf2e4; --g50:#f5f9f2;
  --o600:#ea7a1f; --o500:#fb923c; --o100:#fff0e2;
  --ink:#141a14; --body:#475044; --muted:#7c8577; --line:#e4e8e0; --line2:#eef1eb; --bg:#f6f7f3; --white:#fff;
  --blue:#2f6fde; --blue-bg:#e9f0fd; --amber:#b98a07; --amber-bg:#fbf3d9; --red:#d4443b; --red-bg:#fbe9e7; --grey-bg:#eef0ec;
}
* { box-sizing:border-box; }
html,body { margin:0; }
body { position:relative; width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--ink); font:14px/1.45 Inter, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:0; padding:0; text-align:inherit; }
button:disabled { cursor:not-allowed; }
:focus-visible { outline:2px solid var(--o500); outline-offset:2px; }
svg { display:block; }
.ico { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

#app { width:1440px; height:900px; }
.shell { display:grid; grid-template-columns:76px 1fr; width:1440px; height:900px; }

/* Icon rail */
.side { display:flex; flex-direction:column; align-items:center; padding:18px 0; background:var(--g800); }
.rail-logo { display:grid; place-items:center; width:40px; height:40px; margin-bottom:22px; border-radius:12px; background:var(--o500); color:#fff; font-size:18px; font-weight:800; }
.rail-logo.dark { background:#141a14; }
.nav { display:flex; flex-direction:column; align-items:center; gap:4px; }
.nav-sep { width:26px; height:1px; margin:8px 0; background:rgba(255,255,255,.14); }
.nav button { position:relative; display:grid; place-items:center; width:46px; height:46px; border-radius:14px; color:#b7cfa9; }
.nav button .ico { width:20px; height:20px; }
.nav button:hover { background:rgba(255,255,255,.07); color:#fff; }
.nav button[aria-current="page"] { background:rgba(255,255,255,.12); color:#fff; }
.nav button[aria-current="page"]::before { content:""; position:absolute; left:-15px; top:12px; bottom:12px; width:3px; border-radius:3px; background:var(--o500); }
.nav button .badge { position:absolute; top:5px; right:3px; min-width:17px; height:17px; padding:0 4px; border:2px solid var(--g800); border-radius:10px; background:var(--o500); color:#fff; font-size:9.5px; font-weight:700; line-height:13px; text-align:center; }
.nav button .lock { position:absolute; right:5px; bottom:5px; display:grid; place-items:center; width:15px; height:15px; border-radius:50%; background:var(--g800); color:#fbc58f; }
.nav button .lock .ico { width:10px; height:10px; stroke-width:2.4; }
.nav button .tip { position:absolute; left:58px; top:50%; z-index:30; padding:6px 10px; border-radius:8px; background:var(--ink); color:#fff; font-size:12px; font-weight:600; white-space:nowrap; transform:translateY(-50%); box-shadow:0 8px 20px rgba(0,0,0,.18); opacity:0; pointer-events:none; transition:opacity .12s; }
.nav button:hover .tip, .nav button:focus-visible .tip { opacity:1; }
.side .me-av { margin-top:auto; }

/* Main */
.main { position:relative; display:flex; flex-direction:column; min-width:0; overflow:hidden; }
.top { display:flex; align-items:center; gap:14px; height:64px; flex:none; padding:0 24px 0 32px; background:#fff; border-bottom:1px solid var(--line); }
.ws { display:flex; align-items:center; gap:10px; padding:6px 12px 6px 6px; border:1px solid var(--line); border-radius:12px; }
.ws i { display:grid; place-items:center; width:30px; height:30px; border-radius:8px; background:var(--g700); color:#fff; font-size:12px; font-style:normal; font-weight:700; }
.ws b { display:block; font-size:12.5px; } .ws small { color:var(--muted); font-size:11px; }
.search { display:flex; align-items:center; gap:10px; width:340px; height:38px; padding:0 12px; border:1px solid var(--line); border-radius:10px; color:var(--muted); background:var(--bg); font-size:13px; }
.search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font-size:13px; }
.search input::placeholder { color:var(--muted); }
.search:focus-within { border-color:var(--g500); box-shadow:0 0 0 3px var(--g100); }
.sp { flex:1; }
.content { position:relative; flex:1; min-height:0; padding:26px 32px; overflow:hidden; }
.head { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:20px; }
.crumb { margin:0 0 6px; color:var(--muted); font-size:12px; }
h1 { margin:0; font-size:26px; font-weight:700; letter-spacing:-.03em; }
.btn { display:inline-flex; align-items:center; gap:8px; height:38px; padding:0 15px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font:600 13px Inter, system-ui, sans-serif; white-space:nowrap; }
.btn:hover:not(:disabled) { border-color:#cfd6c9; background:var(--g50); }
.btn.pri { border-color:var(--o500); background:var(--o500); color:#fff; box-shadow:0 6px 16px rgba(251,146,60,.28); }
.btn.pri:hover:not(:disabled) { background:var(--o600); border-color:var(--o600); }
.btn.grn { border-color:var(--g600); background:var(--g600); color:#fff; }
.btn.grn:hover:not(:disabled) { background:var(--g700); }
.btn.ghost-red { color:var(--red); border-color:#f1cdca; }
.btn.danger { background:var(--red); border-color:var(--red); color:#fff; }
.btn:disabled { opacity:.45; box-shadow:none; }
.btn.sm { height:32px; padding:0 11px; font-size:12px; border-radius:9px; }
.btns { display:flex; gap:10px; align-items:center; }
.link { color:var(--g700); font-weight:600; font-size:12.5px; text-decoration:underline; text-underline-offset:2px; }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; }
.card-h { display:flex; align-items:center; justify-content:space-between; padding:18px 20px 0; }
.card-h h3 { margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; }
.card-h small { color:var(--muted); font-size:12px; }
.chip { display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600; white-space:nowrap; }
.chip::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
.chip.new { background:var(--blue-bg); color:var(--blue); } .chip.rev { background:var(--amber-bg); color:var(--amber); } .chip.ok { background:var(--g100); color:var(--g700); } .chip.no { background:var(--red-bg); color:var(--red); } .chip.exp { background:var(--o100); color:var(--o600); } .chip.mute { background:var(--grey-bg); color:var(--muted); }
.chip.crt { background:var(--g700); color:#fff; }
.chip.plain::before { display:none; }
.av { display:grid; place-items:center; flex:none; width:32px; height:32px; border-radius:50%; background:var(--g100); color:var(--g800); font-size:11.5px; font-weight:700; }
.av.o { background:var(--o100); color:var(--o600); } .av.b { background:var(--blue-bg); color:var(--blue); } .av.p { background:#efe9fb; color:#6e48c9; } .av.a { background:var(--amber-bg); color:var(--amber); } .av.k { background:#141a14; color:#fff; }
.av.sm { width:26px; height:26px; font-size:9.5px; }

/* Role switcher */
.role-sw { position:relative; }
.role-btn { display:flex; align-items:center; gap:10px; height:44px; padding:0 10px 0 6px; border:1px solid var(--line); border-radius:12px; background:#fff; }
.role-btn:hover { border-color:var(--g300); }
.role-btn .lbl { line-height:1.2; }
.role-btn .lbl small { display:block; color:var(--muted); font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
.role-btn .lbl b { font-size:12.5px; font-weight:600; }
.role-menu { position:absolute; right:0; top:52px; z-index:60; width:330px; padding:8px; border:1px solid var(--line); border-radius:14px; background:#fff; box-shadow:0 24px 60px rgba(20,26,20,.18); }
.role-menu[hidden] { display:none; }
.role-menu .grp { margin:8px 10px 4px; color:var(--muted); font-size:10.5px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; }
.role-menu button { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:10px; }
.role-menu button:hover { background:var(--g50); }
.role-menu button[aria-pressed="true"] { background:var(--g100); }
.role-menu button b { display:block; font-size:13px; }
.role-menu button small { display:block; color:var(--muted); font-size:11.5px; }
.role-menu button .ck { margin-left:auto; color:var(--g700); visibility:hidden; }
.role-menu button[aria-pressed="true"] .ck { visibility:visible; }

/* KPIs */
.kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:16px; }
.kpi { display:block; width:100%; padding:18px 20px; text-align:left; transition:border-color .15s, box-shadow .15s; }
button.kpi:hover { border-color:var(--g300); box-shadow:0 8px 22px rgba(20,26,20,.06); }
.kpi .row { display:flex; align-items:center; justify-content:space-between; }
.kpi .ic { display:grid; place-items:center; width:36px; height:36px; border-radius:10px; background:var(--g50); color:var(--g700); border:1px solid var(--g100); }
.kpi .ic.o { background:var(--o100); color:var(--o600); border-color:#ffe2c6; }
.kpi p { margin:14px 0 2px; color:var(--muted); font-size:12.5px; }
.kpi strong { font-size:28px; font-weight:750; letter-spacing:-.04em; }
.trend { font-size:11.5px; font-weight:600; color:var(--g700); }
.trend.down { color:var(--o600); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.bump { animation:bump .5s ease; }
@keyframes bump { 0%{ color:var(--o600); transform:scale(1.08);} 100%{ transform:scale(1);} }

/* Pipeline */
.pipe { padding:12px 20px 18px; }
.pipe button { display:grid; grid-template-columns:150px 1fr 36px; align-items:center; gap:14px; width:100%; padding:9px 10px; border-radius:10px; }
.pipe button:hover { background:var(--g50); }
.pipe .bar { height:10px; }
.pipe b { font-size:15px; text-align:right; }
.bar { height:6px; border-radius:6px; background:var(--grey-bg); overflow:hidden; }
.bar i { display:block; height:100%; border-radius:6px; background:var(--g500); transition:width .4s ease; }

/* Tables */
table { width:100%; border-collapse:collapse; }
th { padding:11px 14px; color:var(--muted); font-size:11.5px; font-weight:600; text-align:left; letter-spacing:.02em; background:var(--g50); border-bottom:1px solid var(--line); }
td { padding:11px 14px; border-bottom:1px solid var(--line2); font-size:13px; color:var(--body); vertical-align:middle; }
tr:last-child td { border-bottom:0; }
td b { color:var(--ink); font-weight:600; }
tbody tr.click { cursor:pointer; }
tbody tr.click:hover td { background:#fbfdf9; }
tr.picked td { background:var(--g50) !important; }
.co { display:flex; align-items:center; gap:10px; }
.co small { display:block; color:var(--muted); font-size:11.5px; } .co b { display:block; color:var(--ink); font-weight:600; }
.co i { display:grid; place-items:center; flex:none; width:32px; height:32px; border-radius:9px; background:var(--g50); border:1px solid var(--line); font-style:normal; font-size:15px; }
.rowbtn { display:flex; align-items:center; gap:10px; border-radius:8px; }
.pri-dot { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
.pri-dot::before { content:""; width:8px; height:8px; border-radius:2px; background:currentColor; }
.hi { color:var(--red); } .md { color:var(--amber); } .lo { color:var(--muted); }
.tabs { display:flex; gap:4px; padding:4px; border:1px solid var(--line); border-radius:11px; background:#fff; }
.tabs button { display:flex; align-items:center; gap:7px; padding:7px 12px; border-radius:8px; color:var(--body); font-size:12.5px; font-weight:600; }
.tabs button:hover { background:var(--g50); }
.tabs button[aria-selected="true"] { background:var(--g700); color:#fff; }
.tabs button em { padding:0 6px; border-radius:10px; background:var(--grey-bg); color:var(--muted); font-size:10.5px; font-style:normal; }
.tabs button[aria-selected="true"] em { background:rgba(255,255,255,.22); color:#fff; }
.toolbar { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
.toolbar .search { width:320px; height:36px; background:#fff; }
.pager { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-top:1px solid var(--line2); color:var(--muted); font-size:12px; }

/* Drawer */
.drawer-layer { position:absolute; inset:0; z-index:20; }
.scrim { position:absolute; inset:0; background:rgba(20,26,20,.28); }
.enter .scrim, .modal-layer .scrim { animation:fade .18s ease; }
.drawer { position:absolute; top:0; right:0; bottom:0; width:640px; display:flex; flex-direction:column; background:#fff; box-shadow:-24px 0 60px rgba(20,26,20,.16); }
.enter .drawer { animation:slide .22s ease; }
@keyframes slide { from { transform:translateX(40px); opacity:.4; } }
@keyframes fade { from { opacity:0; } }
.drawer-h { padding:20px 26px 16px; border-bottom:1px solid var(--line); }
.drawer-b { flex:1; min-height:0; display:grid; grid-template-columns:1fr 210px; gap:22px; padding:18px 26px; overflow:auto; }
.drawer-f { display:flex; gap:10px; align-items:center; justify-content:flex-end; padding:14px 26px; border-top:1px solid var(--line); background:var(--g50); }
.drawer-f .note { margin-right:auto; color:var(--muted); font-size:12px; max-width:280px; }
.icon-btn { display:grid; place-items:center; width:32px; height:32px; border:1px solid var(--line); border-radius:9px; color:var(--body); background:#fff; }
.icon-btn:hover { background:var(--g50); }
.sec { margin-bottom:16px; }
.sec h4 { margin:0 0 10px; color:var(--muted); font-size:11px; font-weight:650; letter-spacing:.08em; text-transform:uppercase; }
.kv { display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; }
.kv div small { display:block; color:var(--muted); font-size:11.5px; }
.kv div b { font-size:13px; font-weight:600; }
.qa { padding:9px 12px; margin-bottom:8px; border:1px solid var(--line2); border-radius:10px; background:var(--g50); }
.qa small { display:block; color:var(--muted); font-size:11.5px; }
.qa b { font-size:13px; font-weight:600; }
.flag { display:flex; gap:10px; padding:10px 12px; margin-bottom:14px; border-radius:10px; background:var(--o100); color:#9a4d0c; font-size:12.5px; }
.flag.ok { background:var(--g100); color:var(--g800); }
.flag.err { background:var(--red-bg); color:#9b2a22; }
.flag.inf { background:var(--blue-bg); color:#1e4fa6; }
.flag .ico { flex:none; margin-top:1px; }
.flag b { font-weight:650; }
.timeline { position:relative; padding-left:18px; }
.timeline::before { content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line); }
.tl { position:relative; margin-bottom:15px; font-size:12px; }
.tl::before { content:""; position:absolute; left:-17px; top:3px; width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--g300); }
.tl.done::before { background:var(--g500); border-color:var(--g500); }
.tl.now::before { border-color:var(--o500); background:var(--o500); box-shadow:0 0 0 4px var(--o100); }
.tl.bad::before { border-color:var(--red); background:var(--red); }
.tl b { display:block; font-size:12.5px; } .tl small { color:var(--muted); font-size:11px; }
.field { margin-bottom:12px; }
.field label, .flabel { display:block; margin-bottom:6px; font-size:12px; font-weight:600; color:var(--ink); }
.select, .input, .textarea { width:100%; height:38px; padding:0 10px; border:1px solid var(--line); border-radius:9px; background:#fff; font-size:12.5px; color:var(--ink); }
.textarea { height:96px; padding:10px 12px; resize:none; line-height:1.45; }
.select:focus, .input:focus, .textarea:focus { outline:0; border-color:var(--g500); box-shadow:0 0 0 3px var(--g100); }
.hint { margin-top:6px; color:var(--muted); font-size:11.5px; }
.processing { position:absolute; inset:0; z-index:5; display:grid; place-items:center; background:rgba(255,255,255,.92); text-align:center; animation:fade .15s; }
.spinner { width:42px; height:42px; margin:0 auto 16px; border:4px solid var(--g100); border-top-color:var(--g500); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.processing b { display:block; font-size:15px; } .processing p { margin:6px 0 0; color:var(--muted); font-size:12.5px; }

/* Empty / permission / skeleton */
.empty { display:grid; place-items:center; padding:46px 20px; text-align:center; }
.empty .ill { display:grid; place-items:center; width:76px; height:76px; margin:0 auto 14px; border-radius:22px; background:var(--g50); border:1px solid var(--g100); color:var(--g600); }
.empty .ill.o { background:var(--o100); border-color:#ffe2c6; color:var(--o600); }
.empty .ill .ico { width:32px; height:32px; }
.empty b { display:block; font-size:15px; } .empty p { margin:6px auto 16px; max-width:330px; color:var(--muted); font-size:12.5px; }
.empty .btns { justify-content:center; }
.skel { height:12px; margin-bottom:12px; border-radius:6px; background:linear-gradient(90deg,#eef1eb 0%,#f7f8f5 50%,#eef1eb 100%); background-size:200% 100%; animation:shimmer 1s linear infinite; }
@keyframes shimmer { to { background-position:-200% 0; } }

/* Template builder */
.builder { display:grid; grid-template-columns:1fr 380px; gap:16px; height:calc(100% - 84px); }
.qlist { min-height:0; overflow:auto; padding:2px 6px 10px 2px; }
.q { margin-bottom:10px; border:1px solid var(--line); border-radius:14px; background:#fff; }
.q.on { border-color:var(--g500); box-shadow:0 0 0 4px var(--g100); }
.q-h { display:flex; align-items:center; gap:10px; width:100%; padding:14px 16px; border-radius:14px; }
.q-h .n { display:grid; place-items:center; flex:none; width:24px; height:24px; border-radius:7px; background:var(--g100); color:var(--g800); font-size:11.5px; font-weight:700; }
.q-h .t { flex:1; font-size:13.5px; font-weight:600; }
.q-h .meta { display:flex; gap:6px; }
.q-body { padding:0 16px 14px 50px; }
.q-row { display:grid; grid-template-columns:1fr 170px; gap:10px; }
.opt { display:flex; align-items:center; gap:10px; padding:7px 10px; margin-top:7px; border:1px dashed var(--line); border-radius:9px; font-size:12.5px; color:var(--body); }
.opt i { width:14px; height:14px; border:1.6px solid var(--g500); border-radius:50%; }
.opt i.sq { border-radius:4px; }
.opt.add { color:var(--g700); font-weight:600; border-color:var(--g300); width:100%; }
.q-f { display:flex; align-items:center; gap:18px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line2); }
.switch { display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--body); border-radius:8px; }
.switch i { position:relative; width:30px; height:18px; border-radius:20px; background:#cfd5ca; transition:background .15s; }
.switch i::after { content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; transition:left .15s; }
.switch[aria-checked="true"] i { background:var(--g500); }
.switch[aria-checked="true"] i::after { left:14px; }
.switch:disabled { opacity:.4; }
.addq { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:44px; border:1.5px dashed var(--g300); border-radius:14px; color:var(--g700); font-weight:600; font-size:13px; }
.addq:hover { background:var(--g50); }
.types { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:14px 20px; }
.types button { display:flex; align-items:center; gap:7px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-size:12px; font-weight:500; }
.types button:hover { border-color:var(--g300); background:var(--g50); }
.prev-card { display:flex; flex-direction:column; min-height:0; }
.phone-prev { flex:1; min-height:0; margin:6px 20px 20px; padding:14px; border:1px solid var(--line); border-radius:22px; background:var(--g50); overflow:auto; }
.pq { margin-bottom:10px; padding:10px 12px; border-radius:12px; background:#fff; border:1px solid var(--line); font-size:12px; transition:box-shadow .2s; }
.pq.on { box-shadow:0 0 0 3px var(--g100); border-color:var(--g300); }
.pq > b { display:block; margin-bottom:7px; font-size:12px; }
.pq .req { color:var(--o600); }
.pill-row { display:flex; flex-wrap:wrap; gap:6px; }
.pill-row span, .pill-row button { padding:5px 10px; border:1px solid var(--line); border-radius:20px; font-size:11px; background:#fff; }
.pill-row button[aria-pressed="true"] { border-color:var(--g500); background:var(--g100); color:var(--g800); font-weight:600; }

.week .cell { position:relative; height:96px; border-bottom:1px solid var(--line2); border-left:1px solid var(--line2); }
.ev { position:absolute; left:6px; right:6px; top:6px; z-index:1; padding:7px 9px; border-radius:9px; border-left:3px solid; font-size:11.5px; line-height:1.35; overflow:hidden; }
.ev b { display:block; font-size:12px; }

.ev.o { background:var(--o100); border-color:var(--o500); color:#8c450c; }

.ev.new { animation:pop .5s ease; box-shadow:0 0 0 3px var(--o100); }
.ev .tripl { display:inline-block; margin-top:3px; padding:0 6px; border-radius:8px; background:#fff; font-size:10px; font-weight:700; }

.sup { display:flex; align-items:center; gap:12px; padding:11px 18px; border-top:1px solid var(--line2); }
.sup:first-of-type { border-top:0; }
.sup b { display:block; font-size:13px; } .sup small { color:var(--muted); font-size:11.5px; }
.sup .load { margin-left:auto; flex:none; width:80px; text-align:right; font-size:11px; color:var(--muted); }
.sup .load .bar { margin-top:5px; }

/* Roles matrix */
.matrix th, .matrix td { text-align:center; } .matrix th:first-child, .matrix td:first-child { text-align:left; }
.matrix th.me-col, .matrix td.me-col { background:#fbfdf9; }

.perm { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px; font-size:13px; font-weight:700; }
.perm.y { background:var(--g100); color:var(--g700); } .perm.n { background:var(--grey-bg); color:#b3b9ae; } .perm.s { background:var(--o100); color:var(--o600); font-size:10px; width:auto; padding:0 8px; }
.grp td { padding:8px 14px; background:var(--bg); color:var(--muted); font-size:11px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; text-align:left !important; }

/* Platform */
.ag-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.ag { padding:18px 20px; animation:pop .3s ease; }
.ag .top-row { display:flex; align-items:center; gap:12px; }

.wordmark span::before { content:""; position:absolute; left:-2px; right:-4px; top:-7px; height:8px; border-top:2.5px solid; border-image:linear-gradient(90deg,var(--g500),#a7a83a) 1; border-radius:50%/100% 100% 0 0; }
.ctop .ctab { padding:8px 13px; border-radius:9px; background:var(--g100); color:var(--g800); font-weight:600; font-size:13px; }
.cwrap { flex:1; min-height:0; display:grid; grid-template-columns:1fr 400px; gap:20px; padding:26px 48px; overflow:hidden; }
.track { padding:24px; }

.tryhint { position:absolute; right:20px; bottom:20px; z-index:70; width:290px; padding:13px 12px 8px; border-radius:16px; background:#141a14; color:#e9efe5; box-shadow:0 24px 60px rgba(20,26,20,.3); animation:tin .3s ease; }

/* ---------- toasts ---------- */
function toast(kind, title, text) {
  const t = document.createElement('div');
  t.className = `toast ${kind}`;
  t.innerHTML = `<span class="ti">${ic(kind === 'ok' ? 'check' : kind === 'err' ? 'x' : 'up')}</span><div><b>${esc(title)}</b>${esc(text || '')}</div>`;
  $('#toasts').prepend(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 4200);
  while ($('#toasts').children.length > 3) $('#toasts').lastChild.remove();
}

/* ---------- role switcher ---------- */
function roleSwitcher() {
  const m = me();
  let items = '';
  ROLE_GROUPS.forEach(([g, keys]) => {
    items += `<div class="grp">${g}</div>`;
    keys.forEach(k => {
      const r = k === 'supervisor' ? { name:SUPS[S.supPersona].n, ini:S.supPersona, av:SUPS[S.supPersona].c } : ROLES[k];
      items += `<button type="button" data-role="${k}" aria-pressed="${S.role === k}"><span class="av ${r.av}">${r.ini}</span><span><b>${ROLES[k].label} · ${r.name}</b><small>${ROLES[k].scope}</small></span><span class="ck">${ic('check')}</span></button>`;
    });
  });
  return `<div class="role-sw">
    <button type="button" class="role-btn" id="role-btn" aria-haspopup="true" aria-expanded="${S.menu}" aria-controls="role-menu">
      <span class="av ${m.av} sm">${m.ini}</span><span class="lbl"><small>Viewing as</small><b>${m.label} · ${m.name}</b></span>${ic('chev', 'width:15px;color:var(--muted)')}

  </div>`;
}

function go(view, opts = {}) {
  S.view = view; S.drawer = opts.drawer || null; S.menu = false;
  if (opts.tab) S.tab = opts.tab;
  S.loading = true; render();
  setTimeout(() => { S.loading = false; refresh(); if (opts.focus) $(opts.focus)?.focus(); }, 320);
}
function setRole(r) {
  S.role = r; S.menu = false; S.drawer = null; S.search = '';
  S.view = r === 'platform' ? 'agencies' : 'dash';
  if (r === 'supervisor') S.phone = { screen:'list', ev:null, ans:{}, photos:{}, file:{} };
  S.loading = isAgency() || r === 'platform';
  render();
  if (S.loading) setTimeout(() => { S.loading = false; refresh(); }, 320);
  toast('inf', `Viewing as ${ROLES[r].label}`, ROLES[r].scope + '.');
  $('#role-btn')?.focus();
}

  </tbody></table><div class="pager"><span>Showing ${rows.length} of ${rows.length}</span><span>Updated just now</span></div>`;
}

function timeline(a) {
  const order = ['new', 'review', 'info', 'visit', 'report', 'certified'];
  const i = order.indexOf(a.st);
  const step = (cls, t, s) => `<div class="tl ${cls}"><b>${t}</b><small>${s}</small></div>`;
  let h = step('done', 'Submitted', `${a.sub} · by client`);
  if (a.st === 'rejected') return h + step('done', 'Document review', 'Completed') + step('bad', 'Rejected', 'Reason sent to client');
  h += step(i <= 2 ? 'now' : 'done', a.st === 'info' ? 'Info requested' : 'Document review', a.st === 'new' ? 'Not started' : a.st === 'review' ? `${me().name.split(' ')[0]} · now` : a.st === 'info' ? `Waiting on ${a.contact}` : 'Completed');
  h += step(a.st === 'visit' ? 'now' : i > 3 ? 'done' : '', 'Site visit', a.visit ? `${slotTxt(...a.visit)} · ${SUPS[a.sup].n.split(' ')[0]}` : 'Assigned on approval');
  h += step(a.st === 'report' ? 'now' : a.st === 'certified' ? 'done' : '', 'Certificate', a.st === 'certified' ? a.cert : a.st === 'report' ? 'Ready to issue' : '—');
  return h;
}
function assignBlock(a) {
  const as = S.assign[a.id] || (S.assign[a.id] = { sup:a.sup || '', slot:'3,2' });
  const [d, s] = as.slot.split(',').map(Number);
  const c = as.sup && conflict(as.sup, d, s);
  const fix = c && freeSlot(as.sup);
  const heavy = as.sup && load(as.sup) >= 4;
  return `<div class="sec"><h4>Assign visit</h4>
    <div class="field"><label for="as-sup">Supervisor</label><select class="select" id="as-sup" data-assign="sup"><option value="">Unassigned</option>${Object.entries(SUPS).map(([k, v]) => `<option value="${k}" ${as.sup === k ? 'selected' : ''}>${v.n} · ${load(k)} visits</option>`).join('')}</select></div>
    <div class="field"><label for="as-slot">Visit slot</label><select class="select" id="as-slot" data-assign="slot">${SLOT_OPTS.map(o => `<option value="${o}" ${as.slot === String(o) ? 'selected' : ''}>${slotTxt(...o)}</option>`).join('')}</select></div>
    ${c ? `<div class="flag err" role="alert">${ic('alert')}<span><b>${SUPS[as.sup].n.split(' ')[0]} is busy.</b> ${esc(c.who)} at ${SLOTS[c.s]}. ${fix ? `<button type="button" class="link" data-act="use-slot" data-slot="${fix}">Use ${slotTxt(...fix)}</button>` : ''}</span></div>`
      : heavy ? `<div class="flag">${ic('alert')}<span><b>Busy week for ${SUPS[as.sup].n.split(' ')[0]}.</b> Sam Carter has 0 visits. <button type="button" class="link" data-act="use-sup" data-sup="SC">Assign Sam</button></span></div>`
      : !as.sup ? `<p class="hint">Approving also schedules the visit, so pick a supervisor.</p>` : ''}
  </div>`;
}
function drawerInner(a) {
  const isRev = S.role === 'reviewer';
  const docsFlag = a.issues.length ? (a.docsIn
    ? `<div class="flag ok">${ic('check')}<span><b>Supplier documents received.</b> ${ingList(a)} now have certificates on file.</span></div>`
    : `<div class="flag">${ic('alert')}<span><b>${a.issues.length} ingredient${a.issues.length > 1 ? 's need' : ' needs'} supplier documentation.</b> ${ingList(a)} ${a.issues.length > 1 ? 'have' : 'has'} no supplier certificate on file.</span></div>`) : '';
  const pendingFlag = a.pending && !isRev ? `<div class="flag inf">${ic('send')}<span><b>Tomás Varga recommends approval.</b> Over the 10-product limit for reviewers, so it needs your decision.</span></div>` : '';
  const answers = a.answers || [['Facility', 'Own facility · 1 site'], ['Markets', 'EU, United Kingdom'], ['Production', 'Single shift, 5 days a week']];
  let side = `<div class="sec"><h4>Progress</h4><div class="timeline">${timeline(a)}</div></div>`;
  let main = pendingFlag + docsFlag;
  if (a.st === 'report') main = `<div class="flag ok">${ic('check')}<span><b>Inspection report received.</b> ${a.report.answered} answers · ${a.report.flags ? `${a.report.flags} flagged for review` : 'nothing flagged'} · ${SUPS[a.sup].n}</span></div>` + (a.report.flags ? `<div class="flag">${ic('alert')}<span><b>${a.report.flags} answer${a.report.flags > 1 ? 's' : ''} flagged in the field.</b> Check before issuing.</span></div>` : '');
  if (a.st === 'certified') main = `<div class="flag ok">${ic('badge')}<span><b>Certificate ${a.cert} issued.</b> ${a.n} products · valid until Mar 2027. The client can download it.</span></div>`;
  if (a.st === 'rejected') main = `<div class="flag err">${ic('x')}<span><b>Rejected.</b> Reason shared with the client: “${esc(a.reason)}”</span></div>`;
  if (a.st === 'info') main = `<div class="flag inf">${ic('msg')}<span><b>Info requested from ${a.contact}.</b> “${esc(a.infoMsg)}”</span></div>`;
  if (a.st === 'visit') main = `<div class="flag inf">${ic('cal')}<span><b>Visit scheduled.</b> ${slotTxt(...a.visit)} with ${SUPS[a.sup].n}. The report arrives here when the inspection is submitted.</span></div>`;
  main += `<div class="sec"><h4>Company</h4><div class="kv"><div><small>Contact</small><b>${a.contact}</b></div><div><small>Billing</small><b>Annual plan · Paid</b></div><div><small>Scope</small><b>${a.scope || a.type} · ${a.n} products</b></div><div><small>Application</small><b>${a.id}</b></div></div></div>
    <div class="sec"><h4>Production answers</h4>${answers.map(([q, v]) => `<div class="qa"><small>${q}</small><b>${v}</b></div>`).join('')}</div>`;
  if (a.st === 'review' && !(isRev && a.n > 10)) side += assignBlock(a);

  // footer
  let foot = '', note = '';
  const as = S.assign[a.id] || {};
  const [d, s] = (as.slot || '3,2').split(',').map(Number);
  const blocked = !as.sup || !!conflict(as.sup, d, s);
  if (a.st === 'new') foot = `<button type="button" class="btn ghost-red" data-act="reject">Reject…</button><button type="button" class="btn" data-act="request">Request info</button><button type="button" class="btn pri" data-act="start">Start review</button>`;
  if (a.st === 'review') {
    if (isRev && a.n > 10) {
      note = a.pending ? 'Sent to Elena for a decision.' : `Reviewers approve up to 10 products (this has ${a.n}).`;
      foot = `<button type="button" class="btn ghost-red" data-act="reject">Reject…</button><button type="button" class="btn" data-act="request">Request info</button><button type="button" class="btn pri" data-act="send-up" ${a.pending ? 'disabled' : ''}>${ic('send')}Send to Elena for approval</button>`;
    } else {
      note = blocked ? (as.sup ? 'Pick a free slot to approve.' : 'Assign a supervisor to approve.') : `Visit: ${slotTxt(d, s)} · ${SUPS[as.sup].n}`;
      foot = `<button type="button" class="btn ghost-red" data-act="reject">Reject…</button><button type="button" class="btn" data-act="request">Request info</button><button type="button" class="btn pri" data-act="approve" ${blocked ? 'disabled' : ''}>Approve &amp; schedule visit</button>`;
    }
  }
  if (a.st === 'info') { note = 'Waiting on the client. They see exactly what’s missing.'; foot = `<button type="button" class="btn ghost-red" data-act="reject">Reject…</button><button type="button" class="btn pri" data-act="docs-in">Documents received · resume review</button>`; }
  if (a.st === 'visit') { note = `Waiting on ${SUPS[a.sup].n}’s inspection.`; foot = `<button type="button" class="btn pri" data-act="as-sup">Open ${SUPS[a.sup].n.split(' ')[0]}’s app</button>`; }
  if (a.st === 'report') {
    if (isRev) {
      side += `<div class="sec"><div class="empty" style="padding:6px 0 0"><div><div class="ill o" style="width:56px;height:56px;border-radius:16px">${ic('shield', 'width:24px;height:24px')}</div><b style="font-size:13.5px">Only superadmins can issue certificates</b><p style="font-size:12px">Prepare the decision and send it to Elena for final approval.</p></div></div></div>`;
      foot = `<button type="button" class="btn" data-act="request">Request info</button><button type="button" class="btn pri" data-act="send-up" ${a.pending ? 'disabled' : ''}>${ic('send')}${a.pending ? 'Sent to Elena' : 'Send for approval'}</button>`;
    } else {
      note = 'Generates a signed PDF and notifies the client.';
      foot = `<button type="button" class="btn" data-act="request">Request info</button><button type="button" class="btn pri" data-act="issue">${ic('badge')}Issue certificate</button>`;
    }
  }
  if (a.st === 'certified') foot = `<button type="button" class="btn" data-act="pdf">${ic('down')}Download PDF</button>`;
  if (a.st === 'rejected') note = 'The client can submit a corrected application.';

  return `<div class="drawer-h">
      <div style="display:flex;align-items:center;justify-content:space-between"><span>${chip(a.st)} <span class="chip plain mute" style="margin-left:4px">Submitted ${a.sub}</span></span><button type="button" class="icon-btn" data-act="close-drawer" aria-label="Close">${ic('x')}</button></div>
      <div class="co" style="margin-top:14px"><i style="width:44px;height:44px;font-size:22px">${a.e}</i><div><b id="dr-title" style="font-size:19px;letter-spacing:-.02em">${esc(a.co)}</b><small>${a.type} · ${a.n} products · ${a.city}</small></div></div>
    </div>
    <div class="drawer-b"><div>${main}</div><div>${side}</div></div>
    <div class="drawer-f">${note ? `<span class="note">${note}</span>` : ''}${foot}</div>
    <div id="proc"></div>`;
}

/* ---------- modal ---------- */
function modal({ chipHtml, title, text, label, value = '', sugs = [], confirm, danger, onOk, minLen = 8 }) {
  const layer = document.createElement('div');
  layer.className = 'modal-layer';
  layer.innerHTML = `<div class="scrim" data-x></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    ${chipHtml || ''}<h2 id="m-title">${title}</h2><p>${text}</p>
    ${sugs.length ? `<div class="sugs">${sugs.map(s => `<button type="button" data-sug="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
    <label class="flabel" for="m-text">${label}</label><textarea class="textarea" id="m-text">${esc(value)}</textarea>
    <div class="hint" id="m-hint"></div>
    <div class="foot"><button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn ${danger ? 'danger' : 'pri'}" id="m-ok">${confirm}</button></div></div>`;
  document.body.appendChild(layer);
  const ta = $('#m-text', layer), ok = $('#m-ok', layer), hint = $('#m-hint', layer);
  const check = () => { const n = ta.value.trim().length; ok.disabled = n < minLen; hint.textContent = n < minLen ? 'Write a reason the client can act on.' : 'The client will see this message.'; };
  check(); ta.addEventListener('input', check); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  const close = () => { layer.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', key);
  layer.addEventListener('click', e => {
    if (e.target.closest('[data-x]')) close();
    const sg = e.target.closest('[data-sug]'); if (sg) { ta.value = sg.dataset.sug; check(); ta.focus(); }
  });
  ok.addEventListener('click', () => { onOk(ta.value.trim()); close(); });
}
function formModal({ title, text, fields, confirm, onOk }) {
  const layer = document.createElement('div');
  layer.className = 'modal-layer';
  layer.innerHTML = `<div class="scrim" data-x></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><h2 id="m-title">${title}</h2><p>${text}</p>
    ${fields.map(f => `<div class="field"><label for="f-${f.k}">${f.l}</label>${f.opts ? `<select class="select" id="f-${f.k}">${f.opts.map(o => `<option>${o}</option>`).join('')}</select>` : `<input class="input" id="f-${f.k}" type="${f.type || 'text'}" placeholder="${f.ph || ''}" />`}</div>`).join('')}
    <div class="foot"><button type="button" class="btn" data-x>Cancel</button><button type="button" class="btn pri" id="m-ok" disabled>${confirm}</button></div></div>`;
  document.body.appendChild(layer);
  const ok = $('#m-ok', layer);
  const vals = () => Object.fromEntries(fields.map(f => [f.k, $('#f-' + f.k, layer).value.trim()]));
  const check = () => { const v = vals(); ok.disabled = fields.some(f => !f.opts && (f.type === 'email' ? !/^\S+@\S+\.\S+$/.test(v[f.k]) : v[f.k].length < 2)); };
  layer.addEventListener('input', check);
  const close = () => { layer.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if (e.key === 'Escape') { e.stopPropagation(); close(); } };
  document.addEventListener('keydown', key);
  layer.addEventListener('click', e => { if (e.target.closest('[data-x]')) close(); });
  ok.addEventListener('click', () => { onOk(vals()); close(); });
  $('input,select', layer).focus();
}

/* ---------- lifecycle actions ---------- */
function addMsg(text, from = me()) { S.msgs.push({ from:`${from.name} · Northbridge`, ini:from.ini, av:from.av, when:'Today', text }); }
function act(name, el) {
  const a = S.drawer && app(S.drawer);
  switch (name) {
    case 'close-drawer': S.drawer = null; refresh(); break;
    case 'start':
      a.st = 'review'; S.tab = 'review'; toast('ok', 'Review started', `${a.co} moved to In review.`); refresh(); break;
    case 'request':
      modal({ chipHtml:'<span class="chip rev">Request info</span>', title:`Ask ${a.contact.split(' ')[0]} for more information`, text:'The application stays open. The client sees what’s missing as their next step, not as a rejection.', label:'Message to the client',
        value:a.issues.length && !a.docsIn ? `Please upload supplier certificates for ${a.issues.join(' and ').toLowerCase()}.` : '', sugs:['Please upload the missing supplier certificates.', 'Please send your current production schedule.', 'Please confirm the list of private-label brands.'], confirm:'Send request',
        onOk:t => { a.st = 'info'; a.infoMsg = t; a.pending = false; if (a.id === 'MS-2041') addMsg(t); toast('ok', 'Info requested', `${a.co} moved to Info requested. The client was notified.`); S.tab = 'info'; refresh(); } });
      break;
    case 'reject':
      modal({ chipHtml:'<span class="chip no">Reject application</span>', title:`Reject ${a.type.toLowerCase()} for ${esc(a.co)}?`, text:'The client will see your reason and can submit a corrected request.', label:'Reason (required)', sugs:['A supplier certificate is expired.', 'The product list doesn’t match the facility.'], confirm:'Reject with reason', danger:true,
        onOk:t => { a.st = 'rejected'; a.reason = t; a.pending = false; if (a.id === 'MS-2041') addMsg(`We couldn’t approve this application: ${t}`); toast('err', 'Application rejected', `${a.co} · reason sent to the client.`); S.tab = 'rejected'; refresh(); } });
      break;
    case 'approve': {
      const as = S.assign[a.id]; const [d, s] = as.slot.split(',').map(Number);
      a.st = 'visit'; a.sup = as.sup; a.visit = [d, s]; a.pending = false;
      S.events.push({ id:'e' + Date.now(), who:a.co, sup:as.sup, d, s, len:1, k:'g', sub:a.city.split(',')[0] + ' · First visit', app:a.id, fresh:true });
      if (a.id === 'MS-2041') addMsg(`Approved for a site visit: ${slotTxt(d, s)} with ${SUPS[as.sup].n}.`);
      toast('ok', 'Approved · visit scheduled', `${slotTxt(d, s)} with ${SUPS[as.sup].n}. ${a.co} was notified.`);
      S.tab = 'approved'; refresh(); break;
    }
    case 'send-up':
      a.pending = true; toast('ok', 'Sent to Elena Ruiz', `${a.co} is waiting for a superadmin decision.`); refresh(); break;
    case 'docs-in':
      a.st = 'review'; a.docsIn = true; toast('ok', 'Back in review', `${a.co}’s documents were received.`); S.tab = 'review'; refresh(); break;
    case 'as-sup':
      S.supPersona = a.sup; setRole('supervisor'); break;
    case 'issue': {
      $('#proc').innerHTML = `<div class="processing" role="status"><div><div class="spinner"></div><b>Generating certificate PDF</b><p>Signing ${a.n} product entries. This usually takes a few seconds.</p></div></div>`;
      setTimeout(() => {
        a.st = 'certified'; a.cert = 'NB-26-' + (1200 + S.issued + 1); a.pending = false; S.issued++;
        if (a.id === 'MS-2041') addMsg(`Your certificate ${a.cert} is ready to download.`);
        toast('ok', 'Certificate issued', `${a.co} · ${a.n} products. The client was notified.`); refresh();
      }, 1500);
      break;
    }
    case 'pdf': toast('inf', 'Preparing PDF…', `${a.cert} · ${a.co}`); break;
    case 'use-slot': S.assign[a.id].slot = el.dataset.slot; refresh(); break;
    case 'use-sup': S.assign[a.id].sup = el.dataset.sup; refresh(); break;
    case 'export': toast('inf', 'Exporting CSV…', `${S.apps.length} applications. We’ll download it when it’s ready.`); break;
    case 'share': toast('ok', 'Link copied', 'Send it to companies that want to apply.'); break;
    case 'clear-search': S.search = ''; refresh(); $('#list-search')?.focus(); break;
    case 'group-trip':
      S.tripGrouped = true; S.events.filter(e => e.sup === 'DR' && (e.id === 'e1' || e.id === 'e3')).forEach(e => e.trip = true);
      toast('ok', 'Trip created · Seville → Lyon', 'Daniel’s Mon–Tue visits are now one trip. One flight saved.'); refresh(); break;
    case 'invite':
      formModal({ title:'Invite a member', text:'They get an email, set their own password and finish their profile on first sign-in.', confirm:'Send invite',
        fields:[{ k:'email', l:'Work email', type:'email', ph:'name@northbridge.example' }, { k:'role', l:'Role', opts:['Reviewer', 'Supervisor', 'Superadmin'] }],
        onOk:v => { const k = { Reviewer:'reviewer', Supervisor:'supervisor', Superadmin:'super' }[v.role]; S.members[k]++; toast('ok', 'Invite sent', `${v.email} · ${v.role}. The email address can’t be changed.`); refresh(); } });
      break;
    case 'request-change': toast('ok', 'Request sent to Elena Ruiz', 'She’ll see it next to the template.'); break;
    case 'onboard':
      formModal({ title:'Onboard an agency', text:'We create the workspace and invite its first superadmin.', confirm:'Create workspace',
        fields:[{ k:'name', l:'Agency name', ph:'e.g. Coastline Standards' }, { k:'email', l:'Superadmin email', type:'email', ph:'admin@agency.example' }],
        onOk:v => { if (S.agencies.length >= 6) S.agencies.splice(3, 1); S.agencies.push({ ini:v.name.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase(), name:v.name, where:'Region not set', col:'#6d9957', cos:0, sups:0, certs:0, step:1 }); toast('ok', 'Workspace created', `Invite sent to ${v.email}.`); refresh(); } });
      break;
    case 'advance': {
      const ag = S.agencies[+el.dataset.i]; ag.step++;
      toast('ok', ag.step === 4 ? `${ag.name} is live` : 'Onboarding updated', ag.step === 4 ? 'Their team can now receive applications.' : `Step ${ag.step} of 4 done.`); refresh(); break;
    }
    case 'open-ws': S.view = 'wsdenied'; refresh(); $('#content button')?.focus(); break;
    case 'usage': toast('inf', 'Opening usage report', 'Northbridge Certification · last 30 days.'); break;
    case 'resolve': { const t = S.tickets.find(x => x.id === el.dataset.id); t.open = false; toast('ok', `${t.id} resolved`, 'The agency was notified.'); refresh(); break; }
    case 'publish': {
      S.tpl.published = clone(S.tpl.draft); S.tpl.version++; S.tpl.dirty = false;
      toast('ok', `Template v${S.tpl.version} published`, '5 supervisors get it on their next sync.'); refresh(); break;
    }
    case 'discard': S.tpl.draft = clone(S.tpl.published); S.tpl.dirty = false; S.tpl.sel = S.tpl.draft[0]?.id; refresh(); break;
  }
}

/* ---------- agency: templates ---------- */
function prevQ(q, i, interactive) {
  const opts = q.type === 'yesno' ? ['Yes', 'No'] : q.opts;
  let body = '';
  if (q.type === 'text') body = '<div class="pv-line"></div>';
  else if (q.type === 'file') body = `<div class="pv-photo"><i>⇪</i>Add file</div>`;
  else if (q.type === 'dropdown') body = `<div class="pv-line" style="display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--muted);font-size:11px">Choose…${ic('chev', 'width:13px')}</div>`;
  else body = `<div class="pill-row">${opts.map(o => `<span>${esc(o)}</span>`).join('')}</div>`;

function tplChanged(full = true) {

        <div class="card" style="min-height:0;display:flex;flex-direction:column">
          <div class="card-h" style="padding-bottom:10px"><h3>Messages from your agency</h3><small>${S.msgs.length} message${S.msgs.length > 1 ? 's' : ''}</small></div>
          <div class="msgs">${S.msgs.slice().reverse().map(m => `<div class="msg"><span class="av ${m.av}">${m.ini}</span><div><b>${esc(m.from)}</b> <small style="color:var(--muted)">· ${m.when}</small><p>${esc(m.text)}</p></div></div>`).join('')}</div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="card-h" style="padding-bottom:10px"><h3>Certificates</h3><small>${certs.length - 1} active</small></div>
          ${certs.join('')}
          <div style="padding:14px 18px 18px"><button type="button" class="btn" data-act-c="dlall" style="width:100%;justify-content:center">${ic('down')}Download all certificates (PDF)</button></div>
        </div>
        <div class="card" style="margin-top:16px;padding:16px 18px"><div class="kv"><div><small>Products in this application</small><b>${a.n}</b></div><div><small>Supervisor</small><b>${a.sup && a.visit ? SUPS[a.sup].n : 'Assigned on approval'}</b></div><div><small>Your agency</small><b>Northbridge Certification</b></div><div><small>You can see</small><b>Marisol Spices only</b></div></div></div>
      </div>
    </div></div>`;
}

/* ---------- hint ---------- */
const HINTS = [
  ['flow', 'Open Marisol Spices and take it from review to an issued certificate.'],
  ['roles', 'Switch “Viewing as” to Reviewer, Supervisor or Client and see what changes.'],
  ['tpl', 'Turn on photo evidence in the inspection template, publish, then open the supervisor app.']
];
function renderHint() {
  const r = $('#hint-root');
  r.hidden = !!(S.drawer && S.view === 'apps' && !S.loading);
  const html = !S.hint ? `<button type="button" class="tips-pill" data-hint="open"><i></i>Try this</button>`
    : `<aside class="tryhint" aria-label="Suggestions"><div class="hh"><b><i></i>Try this</b><button type="button" class="x" data-hint="close" aria-label="Dismiss suggestions">${ic('x', 'width:15px')}</button></div>
    <ol>${HINTS.map(([k, t]) => `<li class="${S.hintDone[k] ? 'done' : ''}"><button type="button" data-hint="${k}">${t}</button></li>`).join('')}</ol></aside>`;
  if (r.dataset.html !== html) { r.innerHTML = html; r.dataset.html = html; }
}
function runHint(k) {
  if (k === 'close') { S.hint = false; renderHint(); return; }
  if (k === 'open') { S.hint = true; renderHint(); return; }
  S.hintDone[k] = true;
  if (k === 'flow') {
    if (S.role !== 'super') { S.role = 'super'; }
    const a = app('MS-2041');
    S.tab = TABS.find(t => t[2].includes(a.st))[0];
    go('apps', { drawer:'MS-2041', focus:'.drawer .btn.pri' });
  } else if (k === 'roles') {
    S.menu = true; if (S.role === 'super' || S.role === 'reviewer' || S.role === 'platform') { const sw = $('.role-sw'); sw.outerHTML = roleSwitcher(); } else render();
    renderHint(); $('#role-menu button[aria-pressed="false"]')?.focus();
  } else if (k === 'tpl') {
    S.role = 'super'; S.tpl.sel = S.tpl.draft[0]?.id; go('tpl', { focus:'[data-sw="photo"]' });
  }
  renderHint();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  const hb = t.closest('[data-hint]'); if (hb) { runHint(hb.dataset.hint); return; }
  if (t.closest('#role-btn')) { S.menu = !S.menu; $('.role-sw').outerHTML = roleSwitcher(); if (S.menu) $('#role-menu button')?.focus(); else $('#role-btn').focus(); return; }
  const rb = t.closest('[data-role]'); if (rb) { setRole(rb.dataset.role); return; }
  if (S.menu && !t.closest('.role-sw')) { S.menu = false; $('.role-sw').outerHTML = roleSwitcher(); }

  const nv = t.closest('[data-nav]'); if (nv) { go(nv.dataset.nav); return; }
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go, { tab:g.dataset.tab }); return; }
  const tb = t.closest('[role="tab"][data-tab]'); if (tb) { S.tab = tb.dataset.tab; S.drawer = null; refresh(); $(`[role="tab"][data-tab="${S.tab}"]`)?.focus(); return; }
  const op = t.closest('[data-open]'); if (op) {
    const a = app(op.dataset.open);
    if (S.view !== 'apps') { S.tab = TABS.find(x => x[2].includes(a.st))[0]; go('apps', { drawer:a.id, focus:'.drawer [data-act="close-drawer"]' }); }
    else { S.drawer = a.id; refresh(); $('.drawer [data-act="close-drawer"]')?.focus(); }
    return;
  }
  const ac = t.closest('[data-act]'); if (ac) { act(ac.dataset.act, ac); return; }

  // template builder
  const sq = t.closest('[data-selq]'); if (sq) { S.tpl.sel = +sq.dataset.selq; const l = $('#qlist').scrollTop; refresh(); $('#qlist').scrollTop = l; $('#q-text')?.focus(); return; }
  const dq = t.closest('[data-delq]'); if (dq) { const i = S.tpl.draft.findIndex(q => q.id === +dq.dataset.delq); const q = S.tpl.draft.splice(i, 1)[0]; S.tpl.sel = S.tpl.draft[Math.max(0, i - 1)]?.id; toast('inf', 'Question removed', `“${q.t.slice(0, 40)}${q.t.length > 40 ? '…' : ''}”`); tplChanged(); return; }
  const aq = t.closest('[data-addq]'); if (aq) {
    const type = aq.dataset.addq;
    const q = { id:qSeq++, t:{ yesno:'Is the production area separated from storage?', single:'How are finished goods labelled?', multi:'Which allergens are handled on site?', dropdown:'Which shift was inspected?', text:'Describe any deviations observed', file:'Upload the cleaning log' }[type], type, req:false, photo:false, flag:false, flagOn:type === 'yesno' ? 'No' : '', opts:hasOpts(type) ? ['Option 1', 'Option 2'] : [] };
    if (q.opts.length) q.flagOn = q.opts[0];
    S.tpl.draft.push(q); S.tpl.sel = q.id; tplChanged(); const l = $('#qlist'); l.scrollTop = l.scrollHeight; $('#q-text')?.focus(); $('#tpl-prev').scrollTop = 9999; return;
  }
  const sw = t.closest('[data-sw]'); if (sw) { const q = selQ(); q[sw.dataset.sw] = !q[sw.dataset.sw]; const l = $('#qlist').scrollTop; tplChanged(); $('#qlist').scrollTop = l; $(`[data-sw="${sw.dataset.sw}"]`)?.focus(); return; }
  if (t.closest('[data-act-q="addopt"]')) { const q = selQ(); q.opts.push('Option ' + (q.opts.length + 1)); const l = $('#qlist').scrollTop; tplChanged(); $('#qlist').scrollTop = l; return; }

  // supervisor phone
  const ps = t.closest('[data-persona]'); if (ps) { S.supPersona = ps.dataset.persona; S.phone = { screen:'list', ev:null, ans:{}, photos:{}, file:{} }; render(); $(`[data-persona="${S.supPersona}"]`)?.focus(); return; }
  const ins = t.closest('[data-inspect]'); if (ins) { S.phone = { screen:'inspect', ev:ins.dataset.inspect, ans:{}, photos:{}, file:{} }; render(); $('[data-pback]')?.focus(); return; }
  if (t.closest('[data-pback]')) { S.phone.screen = 'list'; render(); return; }
  const an = t.closest('[data-ans]'); if (an) {
    const id = +an.dataset.ans, q = S.tpl.published.find(x => x.id === id), v = an.dataset.v;
    if (q.type === 'multi') { const arr = S.phone.ans[id] || (S.phone.ans[id] = []); const i = arr.indexOf(v); i < 0 ? arr.push(v) : arr.splice(i, 1); }
    else S.phone.ans[id] = v;
    keepPhoneScroll(); $(`[data-ans="${id}"][data-v="${CSS.escape(v)}"]`)?.focus(); return;
  }
  const ph = t.closest('[data-photo]'); if (ph) { const id = +ph.dataset.photo; S.phone.photos[id] = (S.phone.photos[id] || 0) + 1; keepPhoneScroll(); $(`[data-photo="${id}"]`)?.focus(); return; }
  const fl = t.closest('[data-file]'); if (fl) { S.phone.file[+fl.dataset.file] = true; keepPhoneScroll(); return; }
  if (t.closest('[data-submit]')) {
    const ev = S.events.find(x => x.id === S.phone.ev); ev.done = true;
    const qs = S.tpl.published;
    const flags = qs.filter(q => q.flag && (q.type === 'multi' ? (S.phone.ans[q.id] || []).includes(q.flagOn) : S.phone.ans[q.id] === q.flagOn)).length;
    const a = ev.app && app(ev.app);
    if (a && a.st === 'visit') { a.st = 'report'; a.report = { answered:Object.keys(S.phone.ans).length + Object.keys(S.phone.file).length, flags }; }
    S.phone = { screen:'list', ev:null, ans:{}, photos:{}, file:{} };
    toast('ok', 'Inspection submitted', `${ev.who} · ${flags ? flags + ' answer flagged for the agency' : 'nothing flagged'}. ${a ? 'Northbridge can now issue the certificate.' : ''}`);
    render(); return;
  }

  // client
  const cc = t.closest('[data-act-c]'); if (cc) {
    const a = app('MS-2041');
    const k = cc.dataset.actC;
    if (k === 'upload') {
      cc.disabled = true; toast('inf', `Uploading ${a.issues.length || 1} document${a.issues.length > 1 ? 's' : ''}…`, 'You can keep working; we’ll let you know.');
      setTimeout(() => { a.st = 'review'; a.docsIn = true; S.msgs.push({ from:'Lucía Ferrer · Marisol Spices', ini:'LF', av:'o', when:'Today', text:'Supplier certificates uploaded.' }); toast('ok', 'Documents sent', 'Northbridge was notified and your review continues.'); render(); }, 1300);
    }
    if (k === 'cal') toast('ok', 'Added to your calendar', slotTxt(...a.visit));
    if (k === 'dl' || k === 'dlall') toast('inf', 'Preparing PDF…', 'Your download starts in a moment.');
    if (k === 'resubmit') { a.st = 'new'; a.reason = ''; a.docsIn = false; S.msgs.push({ from:'Lucía Ferrer · Marisol Spices', ini:'LF', av:'o', when:'Today', text:'Corrected application submitted.' }); toast('ok', 'Application resubmitted', 'Northbridge will review it again.'); render(); }
  }
});
function keepPhoneScroll() { const b = $('.pbody'); const top = b ? b.scrollTop : 0; render(); const nb = $('.pbody'); if (nb) nb.scrollTop = top; }

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'list-search' || t.id === 'global-search') {
    S.search = t.value;
    if (S.view === 'apps' && $('#list-body')) {
      const tab = TABS.find(x => x[0] === S.tab);
      const q = S.search.trim().toLowerCase();
      const rows = S.apps.filter(a => tab[2].includes(a.st)).filter(a => !q || (a.co + a.city + a.type + a.id).toLowerCase().includes(q));
      $('#list-body').innerHTML = listBody(rows, tab, q);
      const other = $(t.id === 'list-search' ? '#global-search' : '#list-search'); if (other) other.value = S.search;
    }
    return;
  }
  if (t.dataset.qf === 't') { selQ().t = t.value; tplChanged(false); return; }
  if (t.dataset.ansText) { S.phone.ans[+t.dataset.ansText] = t.value; const btn = $('[data-submit]'); if (btn) { /* light update without losing focus */ const qs = S.tpl.published; const P = S.phone; const ansd = q => q.type === 'file' ? !!P.file[q.id] : q.type === 'multi' ? (P.ans[q.id] || []).length > 0 : !!(P.ans[q.id] && String(P.ans[q.id]).trim()); const left = qs.filter(q => (q.req && !ansd(q)) || (q.photo && !(P.photos[q.id] > 0))).length; btn.disabled = !!left; btn.nextElementSibling.textContent = left ? `${left} required item${left > 1 ? 's' : ''} left` : 'Ready to send · syncs automatically'; } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.assign) { const a = app(S.drawer); S.assign[a.id][t.dataset.assign] = t.value; refresh(); $(`[data-assign="${t.dataset.assign}"]`)?.focus(); return; }
  if (t.dataset.qf === 'type') { const q = selQ(); q.type = t.value; if (hasOpts(q.type) && !q.opts.length) q.opts = ['Option 1', 'Option 2']; q.flagOn = q.type === 'yesno' ? 'No' : q.opts[0] || ''; if (!(q.type === 'yesno' || hasOpts(q.type))) q.flag = false; const l = $('#qlist').scrollTop; tplChanged(); $('#qlist').scrollTop = l; $('#q-type')?.focus(); return; }
  if (t.dataset.qf === 'flagOn') { selQ().flagOn = t.value; tplChanged(false); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'global-search') { S.tab = TABS.find(x => x[2].length && S.apps.some(a => x[2].includes(a.st) && (a.co + a.city + a.id).toLowerCase().includes(S.search.toLowerCase())))?.[0] || S.tab; go('apps', { focus:'#list-search' }); return; }
  if (e.key !== 'Escape' || $('.modal-layer')) return;
  if (S.menu) { S.menu = false; $('.role-sw').outerHTML = roleSwitcher(); $('#role-btn').focus(); return; }
  if (S.drawer) { S.drawer = null; refresh(); }
});

/* ---------- boot ---------- */
S.loading = true; render();
setTimeout(() => { S.loading = false; refresh(); }, 450);
})();
</script>
</body>
</html>
